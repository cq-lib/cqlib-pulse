[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cqlib-pulse"
version = "0.1.0b1"
description = "Pulse-level circuit construction and Tianyan cloud integration for CQLib"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "China Telecom Quantum Group Quantum Computing Team", email = "tianyan@chinatelecom.cn" },
]
keywords = ["cqlib", "quantum computing", "pulse", "QCIS", "Tianyan"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["cqlib-tianyan>=0.1.0,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["build>=1.2", "twine>=5"]
dev = ["mypy>=1.19,<2", "pre-commit>=4,<5", "pytest>=8"]

[project.urls]
Repository = "https://github.com/cq-lib/cqlib-pulse"
Issues = "https://github.com/cq-lib/cqlib-pulse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cqlib_pulse = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
